[package]
name = "accounts"
version = "0.0.6"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rust_decimal = "1.41"
rust_decimal_macros = "1.40"
rusty-money = { version = "0.5" }
chrono = "0.4.44"
chronoutil = "0.2.7"
uuid = { version = "1.23", features = ["serde", "v4"] }
rust-i18n = "3.1"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
